[project]
name = "cmn-c1-066"
version = "0.1.0"
description = "GovernmentProcedureQAAgent -- AgentCore Template (Cat 1, CMN)"
requires-python = ">=3.11"
# pyyaml is a real runtime dependency: PB-7 (and the config-manifest test) import
# it to read config/config.yaml directly.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20240311",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["security_rules*", "tests*", "docs*"]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/examples/"]
# The published framework wheel ships no py.typed marker, so framework.* and
# shared.* imports resolve to Any — which turns every required framework
# subclass into an untyped-import / subclass-of-Any error. Every other strict
# setting stays on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# State extends the framework's AgentState with optional fields — correct at
# runtime, but the untyped wheel makes AgentState resolve to Any, so mypy cannot
# see the TypedDict base and mis-flags every field. Silence only that
# diagnostic, and only for this module: the errors all have the one cause.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
